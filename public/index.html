<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASS FEEDBACK</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:#f4f6fb;color:#1f2937;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h1{margin:0;font-size:1.2rem;letter-spacing:.12em;color:#4f46e5}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
h2{margin:0 0 24px;font-size:1.5rem}
.votes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.vote{flex:1 1 130px;padding:20px 8px;font-size:1.1rem;background:#eef2ff;color:#312e81;transition:.15s}
.vote:hover{background:#c7d2fe;transform:translateY(-2px)}
.vote:disabled{opacity:.5;cursor:default;transform:none}
.link{padding:8px 14px;background:#4f46e5;color:#fff;font-size:.9rem}
.ghost{padding:8px 14px;background:#e5e7eb;color:#374151;font-size:.9rem}
.danger{padding:8px 14px;background:#fee2e2;color:#b91c1c;font-size:.9rem}
.msg{margin-top:20px;min-height:1.4em;color:#059669;font-weight:600}
.msg.err{color:#dc2626}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{display:flex;align-items:center;gap:10px;margin:12px 0;text-align:left}
.stat .name{width:72px;flex:none}
.bar{flex:1;height:22px;background:#e5e7eb;border-radius:11px;overflow:hidden}
.bar>div{height:100%;width:0;transition:width .4s}
.stat .num{width:92px;text-align:right;flex:none;font-size:.9rem}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>CLASS FEEDBACK</h1>
  <button id="loginBtn" class="link">관리자 로그인</button>
</header>
<main>
  <section id="student" class="card">
    <h2>오늘 수업은 어땠나요?</h2>
    <div class="votes">
      <button class="vote" data-r="만족">😊 만족</button>
      <button class="vote" data-r="보통">😐 보통</button>
      <button class="vote" data-r="불만족">😞 불만족</button>
    </div>
    <div id="voteMsg" class="msg"></div>
  </section>

  <section id="login" class="card hidden">
    <h2>관리자 로그인</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="이메일" required autocomplete="username">
      <input id="password" type="password" placeholder="비밀번호" required autocomplete="current-password">
      <div class="row"><button class="link" type="submit">로그인</button><button class="ghost" type="button" id="cancelLogin">취소</button></div>
    </form>
    <div id="loginMsg" class="msg err"></div>
  </section>

  <section id="admin" class="card hidden">
    <h2>수업 만족도 결과</h2>
    <p>전체 투표 수: <strong id="total">0</strong></p>
    <div id="stats"></div>
    <div class="row">
      <button class="ghost" id="refresh">결과 새로고침</button>
      <button class="danger" id="reset">투표 결과 초기화</button>
      <button class="ghost" id="logout">로그아웃</button>
    </div>
    <div id="adminMsg" class="msg err"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const ITEMS = [["만족","😊","#10b981"],["보통","😐","#f59e0b"],["불만족","😞","#ef4444"]];

function show(id){
  ["student","login","admin"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  $("loginBtn").classList.toggle("hidden", id !== "student");
}

document.querySelectorAll(".vote").forEach(b => b.onclick = async () => {
  const btns = document.querySelectorAll(".vote");
  btns.forEach(x => x.disabled = true);
  const { error } = await sb.from("votes").insert({ rating: b.dataset.r });
  $("voteMsg").className = "msg" + (error ? " err" : "");
  $("voteMsg").textContent = error ? "저장에 실패했습니다. 다시 시도해 주세요." : "투표가 완료되었습니다. 감사합니다.";
  btns.forEach(x => x.disabled = false);
});

$("loginBtn").onclick = () => { $("loginMsg").textContent = ""; show("login"); };
$("cancelLogin").onclick = () => show("student");

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) { $("loginMsg").textContent = "로그인에 실패했습니다. 이메일/비밀번호를 확인하세요."; return; }
  $("password").value = "";
  await loadResults();
  show("admin");
};

async function loadResults(){
  $("adminMsg").textContent = "";
  const { data, error } = await sb.from("votes").select("rating");
  if (error) { $("adminMsg").textContent = "결과를 불러오지 못했습니다."; return; }
  const total = data.length;
  $("total").textContent = total;
  $("stats").innerHTML = ITEMS.map(([name, emoji, color]) => {
    const n = data.filter(v => v.rating === name).length;
    const p = total ? Math.round(n / total * 1000) / 10 : 0;
    return `<div class="stat"><span class="name">${emoji} ${name}</span><div class="bar"><div style="width:${p}%;background:${color}"></div></div><span class="num">${n}표 (${p}%)</span></div>`;
  }).join("");
}

$("refresh").onclick = loadResults;

$("reset").onclick = async () => {
  if (!confirm("모든 투표 결과를 초기화하시겠습니까? 삭제된 결과는 복구할 수 없습니다.")) return;
  const { error } = await sb.from("votes").delete().gt("id", 0);
  if (error) { $("adminMsg").textContent = "초기화에 실패했습니다."; return; }
  await loadResults();
};

$("logout").onclick = async () => { await sb.auth.signOut(); $("voteMsg").textContent = ""; show("student"); };

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { await loadResults(); show("admin"); }
})();
</script>
</body>
</html>
